name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dustatus-debug-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DUstatus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" DUstatus-debug.apk
          if ! gh release view latest-debug >/dev/null 2>&1; then
            gh release create latest-debug --target "$GITHUB_SHA" --title "DUstatus - Latest Debug APK" --notes "Development build. Updated automatically after successful builds." --prerelease
          fi
          gh release upload latest-debug DUstatus-debug.apk --clobber
